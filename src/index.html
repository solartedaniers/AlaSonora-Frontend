<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AlaSonora — Bioacústica &amp; IA</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <!-- Debe ser literal (el navegador no lee variables CSS aquí): replica --color-chrome de tokens.scss,
       así la barra del navegador continúa la cabecera en cada tema. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f4c5c" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1418" />
  <meta name="apple-mobile-web-app-title" content="AlaSonora" />
  <meta name="description" content="AlaSonora: identificación de aves por su canto mediante inteligencia artificial, con mapa público de avistamientos." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AlaSonora" />
  <meta property="og:title" content="AlaSonora — Bioacústica &amp; IA" />
  <meta property="og:description" content="Identificación de aves por su canto mediante inteligencia artificial." />
  <meta property="og:locale" content="es_CO" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preload" href="assets/fonts/atkinson-hyperlegible-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/bricolage-grotesque-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <!-- El servidor no lee localStorage y entrega el tema claro: aplico el guardado ("alasonora.theme") antes
       del primer pintado para que el tema oscuro no destelle en claro al hidratar. -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('alasonora.theme') || 'system';
        var dark = mode === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : mode !== 'light';
        var theme = dark ? 'theme-dark' : 'theme-light';
        document.documentElement.classList.remove('theme-light', 'theme-dark');
        document.documentElement.classList.add(theme);
        document.body.className = theme;
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
