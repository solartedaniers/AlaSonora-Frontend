<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AlaSonora — Bioacústica &amp; IA</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Debe ser literal (el navegador no lee variables CSS aquí): replica --color-surface de tokens.scss. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f6f7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070d10" />
  <meta name="description" content="AlaSonora: identificación de aves por su canto mediante inteligencia artificial, con mapa público de avistamientos." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AlaSonora" />
  <meta property="og:title" content="AlaSonora — Bioacústica &amp; IA" />
  <meta property="og:description" content="Identificación de aves por su canto mediante inteligencia artificial." />
  <meta property="og:locale" content="es_CO" />
  <meta name="twitter:card" content="summary" />

  <link rel="preload" href="assets/fonts/atkinson-hyperlegible-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/bricolage-grotesque-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet"
  />

  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <!--
    Las páginas prerenderizadas (SSG) y las de SSR salen del servidor con el
    tema claro de :root, porque el servidor no puede leer localStorage.
    Este script corre antes del primer pintado y aplica el tema guardado, así
    un usuario con tema oscuro no ve un destello claro mientras hidrata.
    Mismo criterio que ThemeService (clave "alasonora.theme").
  -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('alasonora.theme') || 'system';
        var dark = mode === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : mode !== 'light';
        var theme = dark ? 'theme-dark' : 'theme-light';
        document.documentElement.classList.remove('theme-light', 'theme-dark');
        document.documentElement.classList.add(theme);
        document.body.className = theme;
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
